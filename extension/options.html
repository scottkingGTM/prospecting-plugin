<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prospecting Plugin — Options</title>
  <link rel="stylesheet" href="sidepanel.css">
  <style>
    .opts { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
    .opts h2 { font-size: 16px; margin: 0 0 14px; color: var(--accent); }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      font-family: inherit;
    }
    .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    #status-line { margin-top: 12px; font-size: 12px; min-height: 18px; }
    #status-line.ok { color: var(--ok); }
    #status-line.err { color: var(--err); }
    #token-state { font-size: 12px; color: var(--ok); margin-top: 4px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="opts">
    <h2>Prospecting Plugin — Settings</h2>

    <div class="field">
      <label for="backend-url">Backend URL</label>
      <input id="backend-url" type="url" placeholder="http://127.0.0.1:8080"
             autocomplete="off" spellcheck="false">
      <div class="hint">Local dev: http://127.0.0.1:8080 · Production: your deployed backend URL.</div>
    </div>

    <div class="field">
      <label for="rep-token">Rep token</label>
      <input id="rep-token" type="password" placeholder="Paste your rep token"
             autocomplete="off" spellcheck="false">
      <div class="hint">This token identifies YOU — every enrichment and commit is
        logged against it. Don't share it or paste it anywhere else.</div>
      <div id="token-state"></div>
    </div>

    <div class="actions">
      <button id="test-btn" class="btn">Test connection</button>
      <button id="save-btn" class="btn primary">Save</button>
    </div>

    <div id="status-line"></div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
